# nginx is NOT here. It runs on the host, where it also holds the certbot
# certificates. Each service below publishes to 127.0.0.1 only, so the proxy can
# reach it while the public internet cannot — binding 0.0.0.0 would expose
# plaintext HTTP and let anyone bypass TLS. See DEPLOYMENT.md for the server
# blocks and the certbot steps.

services:

    web:
        build:
            context: .
            dockerfile: apps/web/Dockerfile.prod
            args:
                # Compiled into the browser bundle at build time, so these are
                # the URLs a BROWSER uses — public https:// origins, never
                # container names. Changing them needs a rebuild, not a restart.
                #
                # Build args do NOT come from env_file — only from the shell or
                # a `.env` beside this file. CI exports them before building.
                # The placeholders are never shipped: the server pulls a finished
                # image and never builds, and they exist only so `pull`, `ps` and
                # `up -d` on the VPS do not fail interpolating a value that is
                # irrelevant there.
                NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4001}
                NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4002/ws}
        image: codeheist/spidder-web:${IMAGE_TAG:-latest}
        container_name: spidder-web-prod
        restart: always
        env_file:
            - .env.prod
        ports:
            - "127.0.0.1:3001:3001"
        networks:
            - spidder-network
        depends_on:
            - http-api
            - ws-server

    http-api:
        build:
            context: .
            dockerfile: apps/http-api/Dockerfile.prod
        image: codeheist/spidder-http-api:${IMAGE_TAG:-latest}
        container_name: spidder-http-api-prod
        restart: always
        env_file:
            - .env.prod
        environment:
            # Server-to-server, for the admin dashboard's live connection
            # counts. Must be set: the code defaults to localhost:4002, which
            # inside this container is the container itself.
            - WS_SERVER_INTERNAL_URL=http://ws-server:4002
        ports:
            - "127.0.0.1:4001:4001"
        networks:
            - spidder-network
        # PostgreSQL and Redis run on the host, not in Docker. This maps
        # host.docker.internal to the docker bridge gateway so .env.prod can
        # address them; there is no db service to depend_on.
        extra_hosts:
            - "host.docker.internal:host-gateway"

    ws-server:
        build:
            context: .
            dockerfile: apps/ws-server/Dockerfile.prod
        image: codeheist/spidder-ws-server:${IMAGE_TAG:-latest}
        container_name: spidder-ws-server-prod
        restart: always
        env_file:
            - .env.prod
        ports:
            - "127.0.0.1:4002:4002"
        networks:
            - spidder-network
        extra_hosts:
            - "host.docker.internal:host-gateway"

    judge-worker:
        build:
            context: .
            dockerfile: apps/judge-worker/Dockerfile.prod
        image: codeheist/spidder-judge-worker:${IMAGE_TAG:-latest}
        container_name: spidder-judge-worker-prod
        restart: always
        env_file:
            - .env.prod
        networks:
            - spidder-network
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            piston:
                condition: service_healthy

    piston:
        image: ghcr.io/engineer-man/piston
        container_name: spidder-piston-prod
        restart: always
        # Needs privileged mode to build its own isolation cgroups. No
        # published port: only judge-worker talks to it, over this network.
        privileged: true
        volumes:
            - piston_data:/piston
        networks:
            - spidder-network
        healthcheck:
            # The piston image ships Node 15 — no fetch, no curl, no wget.
            test: [ "CMD", "node", "-e", "require('http').get('http://127.0.0.1:2000/api/v2/runtimes',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))" ]
            interval: 15s
            timeout: 5s
            retries: 20
            start_period: 30s

    # Installs the Python runtime into piston, then exits. Idempotent.
    piston-init:
        image: alpine:3.20
        container_name: spidder-piston-init-prod
        restart: "no"
        environment:
            - PISTON_URL=http://piston:2000/api/v2
        volumes:
            - ./docker/piston-init/provision.sh:/provision.sh:ro
        entrypoint: [ "/bin/sh", "/provision.sh" ]
        networks:
            - spidder-network
        depends_on:
            piston:
                condition: service_healthy

    # Applies Prisma migrations to the host PostgreSQL, then exits.
    #
    # NOT a database — it is a one-shot client carrying the Prisma CLI, which
    # the slim app images do not include. Run it by hand when a release carries
    # a schema change; nothing starts it automatically:
    #
    #   docker compose -f docker-compose.prod.yml run --rm db-init
    db-init:
        build:
            context: .
            dockerfile: docker/db-init/Dockerfile
        image: codeheist/spidder-db-init:${IMAGE_TAG:-latest}
        container_name: spidder-db-init-prod
        restart: "no"
        env_file:
            - .env.prod
        networks:
            - spidder-network
        extra_hosts:
            - "host.docker.internal:host-gateway"

    # No db or redis services: PostgreSQL and Redis are installed on the host
    # via apt and reached through host.docker.internal. The host must let them
    # in — postgresql.conf needs listen_addresses = 'localhost,172.17.0.1',
    # pg_hba.conf needs the 172.16.0.0/12 bridge subnet, and redis.conf needs
    # bind 127.0.0.1 172.17.0.1 with requirepass set. Keep 5432 and 6379
    # firewalled off the public internet.

networks:
    spidder-network:
        driver: bridge

volumes:
    piston_data:
